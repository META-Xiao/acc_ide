plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.acc_ide'
    compileSdk 33

    defaultConfig {
        applicationId "com.acc_ide"
        minSdk 24
        targetSdk 33
        versionCode 131
        versionName "1.3.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                abiFilters "arm64-v8a"
            }
        }
    }
    
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    bundle {
        language {
            enableSplit = false
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        apiVersion = '2.1'
        languageVersion = '2.1'
    }

    packaging {
        resources {
            excludes += [
                'license/README.dom.txt',
                'license/LICENSE.dom-documentation.txt',
                'license/NOTICE',
                'license/LICENSE',
                'license/LICENSE.dom-software.txt'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.drawerlayout:drawerlayout:1.1.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.5.3'
    implementation 'androidx.navigation:navigation-ui-ktx:2.5.3'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Termux modules dependencies
    implementation project(':termux:application')
    implementation project(':termux:shared')
    implementation project(':termux:emulator')
    implementation project(':termux:view')
    
    // 直接添加termux-am-library依赖，确保app模块可以访问termux类
    implementation 'com.github.termux:termux-am-library:v2.0.0'
    
    // Core modules dependencies
    implementation project(':core:common')
    implementation project(':core:resources')

    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib") {
            version {
                strictly("2.1.0")
            }
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-common") {
            version {
                strictly("2.1.0")
            }
        }
    }
    
    implementation(platform("io.github.rosemoe:editor-bom:0.23.7"))
    implementation 'io.github.rosemoe:editor'
    implementation 'io.github.rosemoe:language-textmate'
    implementation("io.github.Rosemoe.sora-editor:textmate-core:0.8.4")
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
} 