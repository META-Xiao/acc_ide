plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.acc_ide'
    compileSdk 33
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.acc_ide"
        minSdk 26
        targetSdk 33
        versionCode 123
        versionName "1.2.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Only build for architectures that have Tree-sitter libraries
        ndk {
            abiFilters 'arm64-v8a'
        }
        
        // CMake arguments for 16KB page size compatibility
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_LD=lld'
                cppFlags '-fPIC'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled false
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        apiVersion = '2.1'
        languageVersion = '2.1'
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')  
            version '3.22.1'
        }
    }

    ndkVersion '26.1.10909125'

    lint {
        baseline = file("lint-baseline.xml")
    }

    packaging {
        resources {
            excludes += [
                    'license/README.dom.txt',
                    'license/LICENSE.dom-documentation.txt',
                    'license/NOTICE',
                    'license/LICENSE',
                    'license/LICENSE.dom-software.txt'
            ]
        }
    }

    packagingOptions {
        // Only exclude AndroidIDE tree-sitter library (if any)
        exclude '**/libandroid-tree-sitter.so'
        
        // Keep our custom tree-sitter libraries
        // exclude '**/libtree-sitter.so'           // We need this
        // exclude '**/libtree-sitter-java.so'      // We need this  
        // exclude '**/libtree-sitter-cpp.so'       // We need this
        // exclude '**/libtree-sitter-python.so'    // We need this
        
        // Handle 16KB page size alignment issues with pre-built libraries
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.drawerlayout:drawerlayout:1.1.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.5.3'
    implementation 'androidx.navigation:navigation-ui-ktx:2.5.3'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    implementation("org.jetbrains.kotlin:kotlin-stdlib:2.1.0")
    implementation("org.jetbrains.kotlin:kotlin-stdlib-common:2.1.0")

    implementation(platform("io.github.rosemoe:editor-bom:0.23.7"))
    implementation 'io.github.rosemoe:editor'
    implementation 'io.github.rosemoe:language-textmate'
    implementation 'io.github.rosemoe:editor-lsp'
    implementation project(':language-treesitter')
    implementation("io.github.Rosemoe.sora-editor:textmate-core:0.8.4")
    
    // LSP4J dependencies
    implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j:0.21.1'
    implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j.jsonrpc:0.21.1'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.yaml:snakeyaml:2.2'
}
