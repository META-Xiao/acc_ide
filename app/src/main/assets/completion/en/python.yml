# Python Completion Configuration - English Version
language: python
locale: en
version: "1.0"

# Control flow keywords
control_flow:
  - label: "if"
    insert_text: "if ${1:condition}:\n    ${2:pass}"
    detail: "If statement"
    kind: snippet
    priority: 20
    
  - label: "elif"
    insert_text: "elif ${1:condition}:\n    ${2:pass}"
    detail: "Elif statement"
    kind: snippet
    priority: 18
    
  - label: "else"
    insert_text: "else:\n    ${1:pass}"
    detail: "Else statement"
    kind: snippet
    priority: 18
    
  - label: "for"
    insert_text: "for ${1:item} in ${2:iterable}:\n    ${3:pass}"
    detail: "For loop"
    kind: snippet
    priority: 20
    
  - label: "while"
    insert_text: "while ${1:condition}:\n    ${2:pass}"
    detail: "While loop"
    kind: snippet
    priority: 18
    
  - label: "try"
    insert_text: "try:\n    ${1:pass}\nexcept ${2:Exception} as e:\n    ${3:pass}"
    detail: "Exception handling"
    kind: snippet
    priority: 18
    
  - label: "with"
    insert_text: "with ${1:expression} as ${2:variable}:\n    ${3:pass}"
    detail: "With statement"
    kind: snippet
    priority: 16

# Function and class definitions
definitions:
  - label: "def"
    insert_text: "def ${1:function_name}(${2:args}):\n    \"\"\"${3:Function description}\"\"\"\n    ${4:pass}"
    detail: "Function definition"
    kind: snippet
    priority: 22
    
  - label: "class"
    insert_text: "class ${1:ClassName}:\n    \"\"\"${2:Class description}\"\"\"\n    \n    def __init__(self${3:, args}):\n        ${4:pass}"
    detail: "Class definition"
    kind: snippet
    priority: 20
    
  - label: "lambda"
    insert_text: "lambda ${1:args}: ${2:expression}"
    detail: "Lambda function"
    kind: snippet
    priority: 15

