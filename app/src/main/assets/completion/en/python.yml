# Data structure operations
data_structures:
  - label: "list_comprehension"
    insert_text: "[${1:expression} for ${2:item} in ${3:iterable}]"
    detail: "List comprehension"
    kind: snippet
    priority: 18
    
  - label: "dict_comprehension"
    insert_text: "{${1:key}: ${2:value} for ${3:item} in ${4:iterable}}"
    detail: "Dictionary comprehension"
    kind: snippet
    priority: 16
    
  - label: "enumerate"
    insert_text: "for ${1:index}, ${2:value} in enumerate(${3:iterable}):\n    ${4:pass}"
    detail: "Enumerate iteration"
    kind: snippet
    priority: 18
    
  - label: "zip"
    insert_text: "for ${1:a}, ${2:b} in zip(${3:list1}, ${4:list2}):\n    ${5:pass}"
    detail: "Parallel iteration"
    kind: snippet
    priority: 16

# File operations
file_operations:
  - label: "open_file"
    insert_text: "with open('${1:filename}', '${2:r}') as ${3:f}:\n    ${4:content = f.read()}"
    detail: "File I/O"
    kind: snippet
    priority: 18
    
  - label: "read_lines"
    insert_text: "with open('${1:filename}', 'r') as f:\n    lines = f.readlines()"
    detail: "Read all lines"
    kind: snippet
    priority: 16

# Competitive programming snippets
competitive_snippets:
  - label: "fast_input"
    insert_text: "import sys\ninput = sys.stdin.readline"
    detail: "Fast input optimization"
    kind: snippet
    priority: 20
    
  - label: "main_template"
    insert_text: "def main():\n    # Fast input\n    import sys\n    input = sys.stdin.readline\n    \n    ${1:# TODO: Implement code}\n    \nif __name__ == '__main__':\n    main()"
    detail: "Main function template"
    kind: snippet
    priority: 25
    
  - label: "gcd"
    insert_text: "def gcd(a, b):\n    while b:\n        a, b = b, a % b\n    return a"
    detail: "Greatest Common Divisor"
    kind: snippet
    priority: 16
    
  - label: "binary_search"
    insert_text: "def binary_search(arr, target):\n    left, right = 0, len(arr) - 1\n    while left <= right:\n        mid = (left + right) // 2\n        if arr[mid] == target:\n            return mid\n        elif arr[mid] < target:\n            left = mid + 1\n        else:\n            right = mid - 1\n    return -1"
    detail: "Binary search"
    kind: snippet
    priority: 16

