# Java Completion Configuration - English Version
language: java
locale: en
version: "1.0"

# Basic data types
data_types:
  - label: "int"
    insert_text: "int"
    detail: "Integer type"
    kind: keyword
    priority: 10
    
  - label: "double"
    insert_text: "double"
    detail: "Double precision floating point"
    kind: keyword
    priority: 10
    
  - label: "float"
    insert_text: "float"
    detail: "Single precision floating point"
    kind: keyword
    priority: 10
    
  - label: "boolean"
    insert_text: "boolean"
    detail: "Boolean type"
    kind: keyword
    priority: 10
    
  - label: "char"
    insert_text: "char"
    detail: "Character type"
    kind: keyword
    priority: 10
    
  - label: "String"
    insert_text: "String"
    detail: "String type"
    kind: class
    priority: 12

# Access modifiers
access_modifiers:
  - label: "public"
    insert_text: "public"
    detail: "Public access modifier"
    kind: keyword
    priority: 15
    
  - label: "private"
    insert_text: "private"
    detail: "Private access modifier"
    kind: keyword
    priority: 15
    
  - label: "protected"
    insert_text: "protected"
    detail: "Protected access modifier"
    kind: keyword
    priority: 15
    
  - label: "static"
    insert_text: "static"
    detail: "Static modifier"
    kind: keyword
    priority: 15
    
  - label: "final"
    insert_text: "final"
    detail: "Final modifier"
    kind: keyword
    priority: 15

# Control flow keywords
control_flow:
  - label: "if"
    insert_text: "if (${1:condition}) {\n    ${2:// TODO}\n}"
    detail: "If statement"
    kind: snippet
    priority: 18
    
  - label: "else"
    insert_text: "else {\n    ${1:// TODO}\n}"
    detail: "Else statement"
    kind: snippet
    priority: 16
    
  - label: "for"
    insert_text: "for (${1:int i = 0}; ${2:i < length}; ${3:i++}) {\n    ${4:// TODO}\n}"
    detail: "For loop"
    kind: snippet
    priority: 18
    
  - label: "while"
    insert_text: "while (${1:condition}) {\n    ${2:// TODO}\n}"
    detail: "While loop"
    kind: snippet
    priority: 16
    
  - label: "switch"
    insert_text: "switch (${1:expression}) {\n    case ${2:value}:\n        ${3:// TODO}\n        break;\n    default:\n        ${4:// TODO}\n        break;\n}"
    detail: "Switch statement"
    kind: snippet
    priority: 16
    
  - label: "try"
    insert_text: "try {\n    ${1:// TODO}\n} catch (${2:Exception} e) {\n    ${3:// Handle exception}\n}"
    detail: "Exception handling"
    kind: snippet
    priority: 16

# Classes and interfaces
class_interface:
  - label: "class"
    insert_text: "public class ${1:ClassName} {\n    ${2:// TODO}\n}"
    detail: "Class definition"
    kind: snippet
    priority: 20
    
  - label: "interface"
    insert_text: "public interface ${1:InterfaceName} {\n    ${2:// TODO}\n}"
    detail: "Interface definition"
    kind: snippet
    priority: 18
    
  - label: "extends"
    insert_text: "extends ${1:SuperClass}"
    detail: "Inheritance keyword"
    kind: keyword
    priority: 15
    
  - label: "implements"
    insert_text: "implements ${1:Interface}"
    detail: "Implementation keyword"
    kind: keyword
    priority: 15

# Methods and constructors
methods:
  - label: "method"
    insert_text: "public ${1:void} ${2:methodName}(${3:}) {\n    ${4:// TODO}\n}"
    detail: "Method template"
    kind: snippet
    priority: 18
    
  - label: "main"
    insert_text: "public static void main(String[] args) {\n    ${1:// TODO}\n}"
    detail: "Main method"
    kind: snippet
    priority: 25

# Input/Output operations
io_operations:
  - label: "System.out.println"
    insert_text: "System.out.println(${1:\"Hello World\"});"
    detail: "Console output"
    kind: snippet
    priority: 20
    
  - label: "Scanner"
    insert_text: "Scanner ${1:scanner} = new Scanner(System.in);"
    detail: "Input scanner"
    kind: snippet
    priority: 18
    
  - label: "sout"
    insert_text: "System.out.println(${1:});"
    detail: "Quick output"
    kind: snippet
    priority: 22

# Collections framework
collections:
  - label: "ArrayList"
    insert_text: "ArrayList<${1:String}> ${2:list} = new ArrayList<>();"
    detail: "Dynamic array"
    kind: snippet
    priority: 18
    
  - label: "HashMap"
    insert_text: "HashMap<${1:String}, ${2:Object}> ${3:map} = new HashMap<>();"
    detail: "Hash map"
    kind: snippet
    priority: 18
    
  - label: "HashSet"
    insert_text: "HashSet<${1:String}> ${2:set} = new HashSet<>();"
    detail: "Hash set"
    kind: snippet
    priority: 16 