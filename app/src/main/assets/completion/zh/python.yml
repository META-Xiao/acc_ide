# Python补全配置 - 中文版
language: python
locale: zh
version: "1.0"

# 控制流关键字
control_flow:
  - label: "if"
    insert_text: "if ${1:condition}:\n    ${2:pass}"
    detail: "条件语句"
    kind: snippet
    priority: 20
    
  - label: "elif"
    insert_text: "elif ${1:condition}:\n    ${2:pass}"
    detail: "否则如果语句"
    kind: snippet
    priority: 18
    
  - label: "else"
    insert_text: "else:\n    ${1:pass}"
    detail: "否则语句"
    kind: snippet
    priority: 18
    
  - label: "for"
    insert_text: "for ${1:item} in ${2:iterable}:\n    ${3:pass}"
    detail: "for循环"
    kind: snippet
    priority: 20
    
  - label: "while"
    insert_text: "while ${1:condition}:\n    ${2:pass}"
    detail: "while循环"
    kind: snippet
    priority: 18
    
  - label: "try"
    insert_text: "try:\n    ${1:pass}\nexcept ${2:Exception} as e:\n    ${3:pass}"
    detail: "异常处理"
    kind: snippet
    priority: 18
    
  - label: "with"
    insert_text: "with ${1:expression} as ${2:variable}:\n    ${3:pass}"
    detail: "with语句"
    kind: snippet
    priority: 16

# 函数和类定义
definitions:
  - label: "def"
    insert_text: "def ${1:function_name}(${2:args}):\n    \"\"\"${3:函数说明}\"\"\"\n    ${4:pass}"
    detail: "函数定义"
    kind: snippet
    priority: 22
    
  - label: "class"
    insert_text: "class ${1:ClassName}:\n    \"\"\"${2:类说明}\"\"\"\n    \n    def __init__(self${3:, args}):\n        ${4:pass}"
    detail: "类定义"
    kind: snippet
    priority: 20
    
  - label: "lambda"
    insert_text: "lambda ${1:args}: ${2:expression}"
    detail: "匿名函数"
    kind: snippet
    priority: 15

