# 数据结构操作
data_structures:
  - label: "list_comprehension"
    insert_text: "[${1:expression} for ${2:item} in ${3:iterable}]"
    detail: "列表推导式"
    kind: snippet
    priority: 18
    
  - label: "dict_comprehension"
    insert_text: "{${1:key}: ${2:value} for ${3:item} in ${4:iterable}}"
    detail: "字典推导式"
    kind: snippet
    priority: 16
    
  - label: "enumerate"
    insert_text: "for ${1:index}, ${2:value} in enumerate(${3:iterable}):\n    ${4:pass}"
    detail: "枚举遍历"
    kind: snippet
    priority: 18
    
  - label: "zip"
    insert_text: "for ${1:a}, ${2:b} in zip(${3:list1}, ${4:list2}):\n    ${5:pass}"
    detail: "并行遍历"
    kind: snippet
    priority: 16

# 文件操作
file_operations:
  - label: "open_file"
    insert_text: "with open('${1:filename}', '${2:r}') as ${3:f}:\n    ${4:content = f.read()}"
    detail: "文件读写"
    kind: snippet
    priority: 18
    
  - label: "read_lines"
    insert_text: "with open('${1:filename}', 'r') as f:\n    lines = f.readlines()"
    detail: "读取所有行"
    kind: snippet
    priority: 16

# 算法竞赛常用
competitive_snippets:
  - label: "fast_input"
    insert_text: "import sys\ninput = sys.stdin.readline"
    detail: "快速输入优化"
    kind: snippet
    priority: 20
    
  - label: "main_template"
    insert_text: "def main():\n    # 快速输入\n    import sys\n    input = sys.stdin.readline\n    \n    ${1:# TODO: 实现代码}\n    \nif __name__ == '__main__':\n    main()"
    detail: "竞赛主函数模板"
    kind: snippet
    priority: 25
    
  - label: "gcd"
    insert_text: "def gcd(a, b):\n    while b:\n        a, b = b, a % b\n    return a"
    detail: "最大公约数"
    kind: snippet
    priority: 16
    
  - label: "binary_search"
    insert_text: "def binary_search(arr, target):\n    left, right = 0, len(arr) - 1\n    while left <= right:\n        mid = (left + right) // 2\n        if arr[mid] == target:\n            return mid\n        elif arr[mid] < target:\n            left = mid + 1\n        else:\n            right = mid - 1\n    return -1"
    detail: "二分查找"
    kind: snippet
    priority: 16

# 字符串操作
string_operations:
  - label: "f_string"
    insert_text: "f\"${1:Hello {name}}\""
    detail: "格式化字符串"
    kind: snippet
    priority: 20
    
  - label: "join"
    insert_text: "'${1:,}'.join(${2:list})"
    detail: "字符串连接"
    kind: snippet
    priority: 16
    
  - label: "split"
    insert_text: "${1:string}.split('${2: }')"
    detail: "字符串分割"
    kind: snippet
    priority: 16 