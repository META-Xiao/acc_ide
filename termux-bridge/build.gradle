plugins {
    id 'com.android.library'
}

android {
    namespace 'com.acc_ide.termux'
    compileSdk 35

    defaultConfig {
        minSdk 24
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlin {
        jvmToolchain(17)
        compilerOptions {
            apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_3
            languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_3
        }
    }
}

dependencies {
    // Termux terminal libraries (JitPack)
    api 'com.github.termux.termux-app:terminal-emulator:v0.118.3'
    api 'com.github.termux.termux-app:terminal-view:v0.118.3'

    // AndroidX
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.annotation:annotation:1.9.0'

    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}

// Download bootstrap archive at build time instead of storing it in git.
// Host the .zip as a GitHub Release asset and set BOOTSTRAP_URL in
// gradle.properties or via -P flag:
//   ./gradlew assembleDebug -PBOOTSTRAP_URL=https://...
//
// If the file already exists locally (e.g. from a prior build), the
// download is skipped. Delete the file manually to force redownload.
def bootstrapAssetDir = layout.projectDirectory.dir('src/main/assets')
def bootstrapFile = bootstrapAssetDir.file('bootstrap-aarch64.zip')

tasks.register('downloadBootstrap') {
    description = 'Download Termux bootstrap-aarch64.zip for com.acc_ide'
    group = 'bootstrap'

    onlyIf {
        if (bootstrapFile.asFile.exists() && bootstrapFile.asFile.length() > 0) {
            logger.lifecycle("Bootstrap archive already exists (${bootstrapFile.asFile.length()} bytes), skipping download.")
            return false
        }
        return true
    }

    doLast {
        def url = project.findProperty('BOOTSTRAP_URL')
                ?: providers.gradleProperty('bootstrap.url').orNull
                ?: 'https://github.com/META-Xiao/acc_ide/releases/download/bootstrap/bootstrap-aarch64.zip'

        logger.lifecycle("Downloading bootstrap from: $url")
        bootstrapAssetDir.asFile.mkdirs()
        bootstrapFile.asFile.withOutputStream { out ->
            out << new URL(url).openStream()
        }
        logger.lifecycle("Downloaded bootstrap: ${bootstrapFile.asFile.length()} bytes")
    }
}

// Automatically download before merging assets
tasks.named('preBuild') { dependsOn 'downloadBootstrap' }
